inputs:
  __app_address__:
    type: string
    label: App Address
    required: true

services:
  main:
    image: registry.k8s.io/pause:3.9
    bind_ports: [80]
    consumes:
      - capability: ai.inference.openai.v1
        env:
          OPENAI_BASE_URL: base_url

listeners:
  - name: __primary
    guest_port: 80
    flow: tcp
    protocol: http

resources:
  priority: normal
  memory:
    min_required: 64MB
    profile: bounded

x-piccolo:
  mode: service
  requires_features:
    - capability_bindings_v1
