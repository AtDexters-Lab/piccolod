name: Tagged Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-ui:
    name: Build UI (Flutter)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build UI
        run: make ui

      - name: Upload Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web
          if-no-files-found: error

  build-server:
    name: Build ${{ matrix.label }}
    needs: build-ui
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            label: linux-aarch64
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web Assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build piccolod (server only)
        run: make server-release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          mv piccolod "dist/piccolod-${{ github.ref_name }}-${{ matrix.label }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piccolod-${{ matrix.label }}
          path: dist/piccolod-${{ github.ref_name }}-${{ matrix.label }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build-server
    runs-on: ubuntu-24.04
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: piccolod-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/piccolod-*
