# RFC 20260130: __primary marker gets replaced at install time
type: user

listeners:
  - name: __primary
    guest_port: 80
    flow: tcp
    protocol: http

permissions:
  network:
    internet: deny

services:
  main:
    image: nginx:alpine
    bind_ports: [80]
    environment:
      ENV: test
    storage:
      persistent:
        data:
          container: /data
          size_limit: 1GB

resources:
  priority: normal
  memory:
    min_required: 512MB
    profile: bounded

x-piccolo:
  mode: service
