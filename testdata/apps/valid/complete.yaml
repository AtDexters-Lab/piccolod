name: testcomplete
type: user

listeners:
  - name: web
    guest_port: 80
    flow: tcp
    protocol: http

permissions:
  network:
    internet: deny

services:
  main:
    image: nginx:alpine
    bind_ports: [80]
    environment:
      ENV: test
    storage:
      persistent:
        data:
          container: /data
          size_limit: 1GB
    resources:
      limits:
        memory: 512MB
        cpu: 0.5

x-piccolo:
  mode: service
