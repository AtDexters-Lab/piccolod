openapi: 3.0.3
info:
  title: Piccolo OS Admin API (Draft)
  version: 0.1.0
security:
  - cookieAuth: []
servers:
  - url: /api/v1
paths:
  /apps:
    get:
      summary: List installed apps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseApps'
    post:
      summary: Install or update an app from app.yaml
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
          application/json:
            schema:
              type: object
              properties:
                app_definition:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseApp'
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /apps/validate:
    post:
      summary: Validate an app.yaml without installing
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema: { type: string }
          application/json:
            schema:
              type: object
              properties:
                app_definition:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /apps/{name}:
    get:
      summary: Get app details (with listeners and container status)
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseAppWithServices'
    delete:
      summary: Uninstall app
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /apps/{name}/start:
    post:
      summary: Start app
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /apps/{name}/stop:
    post:
      summary: Stop app
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /apps/{name}/update:
    post:
      summary: Update an app to a newer tag
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tag: { type: string, nullable: true }
      responses:
        '200': { description: OK }
        '409': { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /apps/{name}/revert:
    post:
      summary: Revert an app to previous version
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /apps/{name}/listeners:
    patch:
      summary: Update app listeners
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listeners:
                  type: array
                  items: { $ref: '#/components/schemas/AppListener' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseAppListenersUpdate' }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /apps/{name}/logs:
    get:
      summary: Get recent logs for an app
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: service
          schema: { type: string }
        - in: query
          name: tail
          schema: { type: integer, minimum: 1, maximum: 5000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppLogs' }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /apps/{name}/logs/stream:
    get:
      summary: Stream app container logs (WebSocket)
      description: |
        Upgrades to a WebSocket connection for a read-only container log stream.
        **Protocol:** JSON messages with Base64 payloads (type=stdout).
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: service
          schema: { type: string }
        - in: query
          name: tail
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - in: query
          name: timestamps
          schema: { type: boolean }
      responses:
        '101':
          description: Switching Protocols
  /apps/{name}/terminal:
    get:
      summary: Connect to app terminal (WebSocket)
      description: |
        Upgrades to a WebSocket connection for a PTY session inside the app container.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: service
          schema: { type: string }
      responses:
        '101':
          description: Switching Protocols
  /services:
    get:
      summary: List all service endpoints
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceEndpoint' }
  /storage/disks:
    get:
      summary: List disks
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageDisks' }
  /exports/control:
    post:
      summary: Generate a control-plane export (PCV)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResponse' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (control plane locked) }
  /exports/full:
    post:
      summary: Generate a full-data export (control + bootstrap volumes)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResponse' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (control plane locked) }
  /system/boot:
    get:
      summary: UI boot directive
      description: |
        Returns a single authoritative routing directive for the UI.
        Consolidates emergency, onboarding, crypto, and auth state checks
        into one response. The `screen` field determines which UI screen
        to render. Additional fields vary by screen value.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [screen]
                properties:
                  screen:
                    type: string
                    enum:
                      - emergency
                      - onboarding
                      - install_progress
                      - install_complete
                      - setup
                      - unlock
                      - login
                      - passkey_required
                      - desktop
                  user: { type: string }
                  has_passkey: { type: boolean }
                  must_register_passkey: { type: boolean }
                  level: { type: string }
                  error: { type: string }
                  boot_mode: { type: string }
                  boot_order_configured: { type: boolean }
                  install_task_id: { type: string }
                  install_abandoned: { type: boolean }
  /crypto/status:
    get:
      summary: Crypto status (initialized/locked)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized: { type: boolean }
                  locked: { type: boolean }
  /crypto/setup:
    post:
      summary: Initialize Piccolo (crypto, auth, and admin user)
      description: |
        Single atomic initialization endpoint for Piccolo. This sets up:
        1. Disk encryption (SDEK)
        2. Auth manager
        3. Admin user in the users database
        4. Auto-unlocks and creates a session

        After successful setup, the caller is logged in as admin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
              required: [password]
      responses:
        '200': { description: OK (also sets session cookie) }
        '400': { description: Bad Request (invalid password or already initialized), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /crypto/unlock:
    post:
      summary: Unlock crypto with admin password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
  /crypto/reset-password:
    post:
      summary: Reset admin password with recovery key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recovery_key: { type: string, description: Space-separated 24-word mnemonic }
                new_password: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '429': { description: Too Many Requests, headers: { Retry-After: { schema: { type: integer } } } }
  /crypto/lock:
    post:
      summary: Lock crypto (forget SDEK)
      responses:
        '200': { description: OK }
  /crypto/recovery-key:
    get:
      summary: Recovery key status
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  present: { type: boolean }
                  stale: { type: boolean }
  /crypto/recovery-key/generate:
    post:
      summary: Generate or rotate recovery key (requires session; rotates if one already exists)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: Optional password to unlock transiently }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  words:
                    type: array
                    items: { type: string }
  /crypto/recovery-key/ack:
    post:
      summary: Acknowledge that the operator has seen and saved the current recovery-key words (admin only)
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '403':
          description: Forbidden during MustRegisterPasskey bootstrap window
        '500':
          description: Failed to record acknowledgement
  /updates/os:
    get:
      summary: OS update status
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OSUpdate' }
  /updates/os/apply:
    post:
      summary: Apply OS update
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        '200': { description: OK }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Forbidden (crypto locked), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Too Many Requests, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '501': { description: Not Implemented (unsupported platform), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '504': { description: Gateway Timeout (transactional-update timed out), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /updates/os/rollback:
    post:
      summary: Roll back OS to previous version
      security:
        - cookieAuth: []
        - csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshot_id:
                  type: string
                  description: Optional specific snapshot ID to rollback to; defaults to newest non-active snapshot when omitted.
      responses:
        '200': { description: OK }
        '400': { description: Bad Request (invalid snapshot id), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Forbidden (crypto locked), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Too Many Requests (update already running), headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '501': { description: Not Implemented (unsupported platform), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '504': { description: Gateway Timeout (transactional-update timed out), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /updates/os/reboot:
    post:
      summary: Trigger system reboot
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        '200': { description: OK }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /updates/apps:
    get:
      summary: App update status
      responses:
        '200': { description: OK }
  /remote/status:
    get:
      summary: Remote access status
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteStatus' }
  /remote/configure:
    post:
      summary: Configure Nexus remote access (user-managed, HTTP-01 only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string, description: Nexus websocket endpoint (wss://...) }
                device_secret: { type: string, description: Shared JWT signing secret for backend clients }
                portal_hostname: { type: string, description: Fully-qualified portal hostname (e.g. portal.home.example.com) }
              required: [endpoint, portal_hostname]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Too Many Requests }
  /remote/disable:
    post:
      summary: Disable remote access
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /remote/rotate:
    post:
      summary: Rotate remote credentials
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_secret: { type: string }
  /remote/preflight:
    post:
      summary: Run remote preflight validation
      description: |
        Validates the remote configuration.
        If a JSON body is provided, it validates that specific candidate configuration (stateless check).
        If the body is empty, it validates the currently active configuration.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                device_secret: { type: string }
                portal_hostname: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ran_at: { type: string, format: date-time }
                  checks:
                    type: array
                    items: { $ref: '#/components/schemas/RemotePreflightCheck' }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /remote/aliases:
    get:
      summary: List remote aliases
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  aliases:
                    type: array
                    items: { $ref: '#/components/schemas/RemoteAlias' }
    post:
      summary: Add a remote alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string }
                listener: { type: string }
              required: [hostname]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteAlias' }
  /remote/aliases/{id}:
    delete:
      summary: Remove remote alias
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /remote/certificates:
    get:
      summary: List issued certificates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificates:
                    type: array
                    items: { $ref: '#/components/schemas/RemoteCertificate' }
  /remote/certificates/{id}/renew:
    post:
      summary: Trigger manual certificate renewal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /remote/events:
    get:
      summary: Remote activity log
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/RemoteEvent' }
  /remote/nexus-guide:
    get:
      summary: Nexus provisioning helper
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteGuideInfo' }
  /remote/nexus-guide/verify:
    post:
      summary: Validate connection credentials (stateless)
      description: |
        Verifies the Nexus connection details.
        Logs the verification event but does NOT persist the configuration (avoiding partial state).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                portal_hostname: { type: string }
                jwt_secret: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified_at: { type: string, format: date-time }
                  message: { type: string }

  /backup/list:
    get:
      summary: List backups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupList' }
  /backup/export:
    post:
      summary: Export configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  download_url: { type: string }
  /backup/import:
    post:
      summary: Import configuration bundle
      responses:
        '200': { description: OK }
  /backup/app/{name}:
    post:
      summary: Create per-app backup
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /restore/app/{name}:
    post:
      summary: Restore per-app backup (latest)
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /install/targets:
    get:
      summary: List install targets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallTargets' }
  /install/plan:
    post:
      summary: Generate install plan (simulate)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallPlan' }
  /install/run:
    post:
      summary: Run install to disk
      responses:
        '200': { description: OK }
        '429': { description: Too Many Requests }
  /install/fetch-latest:
    post:
      summary: Fetch latest signed image
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FetchLatest' }

  /events:
    get:
      summary: Recent events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Events' }

  /logs/bundle:
    get:
      summary: Downloadable log bundle metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundle_id: { type: string }
                  size_bytes: { type: integer }
                  download_url: { type: string }
  /logs/bundle/download:
    get:
      summary: Download logs bundle (zip)
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /catalog:
    get:
      summary: App catalog (cached from remote git)
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogResponse' }
  /catalog/categories:
    get:
      summary: List available app categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { type: string }
  /catalog/{name}/icon:
    get:
      summary: Proxy and cache a catalog app's icon
      security: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Icon image data
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404': { description: App or icon not found }
        '403': { description: Icon URL blocked (SSRF) }
        '502': { description: Failed to fetch icon }
  /catalog/{name}/template:
    get:
      summary: Get example app.yaml for a catalog item
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/x-yaml:
              schema:
                type: string
        '404': { description: Not Found }

  /auth/login:
    post:
      summary: Login
      security: []
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '429': { description: Too Many Requests, headers: { Retry-After: { schema: { type: integer } } } }
  /auth/logout:
    post:
      summary: Logout
      responses:
        '200': { description: OK }
  /auth/initialized:
    get:
      summary: Returns whether admin setup has been completed
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized: { type: boolean }
  /auth/session:
    get:
      summary: Session status
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /auth/password:
    post:
      summary: Change admin password (rewrap keys)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: OK }
  /auth/staleness/ack:
    post:
      summary: Acknowledge credential staleness flags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: boolean }
                recovery: { type: boolean }
      responses:
        '200': { description: OK }
  /auth/csrf:
    get:
      summary: Get CSRF token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }

  /terminal:
    get:
      summary: Connect to debug terminal (WebSocket)
      description: |
        Upgrades to a WebSocket connection for an interactive shell session.
        **Security:** Restricted to local LAN connections only. Remote access via Nexus is blocked.
        **Protocol:** JSON messages with Base64 payloads.
      security:
        - cookieAuth: []
      responses:
        '101':
          description: Switching Protocols

  /system/logs/stream:
    get:
      summary: Stream system logs (WebSocket)
      description: |
        Upgrades to a WebSocket connection for a read-only journald stream.
        Units are allowlisted by the server.
        **Protocol:** JSON messages with Base64 payloads (type=stdout).
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: unit
          required: true
          schema: { type: string }
        - in: query
          name: tail
          schema: { type: integer, minimum: 1, maximum: 5000 }
      responses:
        '101':
          description: Switching Protocols

  /tasks/active:
    get:
      summary: List in-progress tasks
      description: Returns active (non-complete, non-stale) task progress events.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskProgressEvent'
                  message:
                    type: string

  /events/progress/stream:
    get:
      summary: Stream task progress events (WebSocket)
      description: |
        Upgrades to a WebSocket connection for structured task progress events.
        The client should pass a unique task_id and subscribe before triggering an operation.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: task_id
          required: true
          schema: { type: string }
      responses:
        '101':
          description: Switching Protocols

  /sso/start:
    get:
      summary: Begin app SSO (portal issues one-time ticket and redirects)
      parameters:
        - in: query
          name: app
          required: true
          schema: { type: string }
        - in: query
          name: return
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to gate callback with code
          headers:
            Location:
              schema: { type: string }
              description: Redirect URI including one-time code
  /sso/consume:
    post:
      summary: Exchange one-time code for app session (gate back-channel)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string }
                  token: { type: string, description: Signed app session (JWT or opaque) }
                  expires_at: { type: string, format: date-time }
        '400': { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /sso/keys:
    get:
      summary: Public keys for verifying SSO tokens (JWKS)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty: { type: string }
                        crv: { type: string }
                        x: { type: string }
                        kid: { type: string }
  /sso/logout:
    post:
      summary: Invalidate current portal session and optionally broadcast to gates
      responses:
        '200': { description: OK }

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        details: { type: string, nullable: true }
        next_step: { type: string, nullable: true }
    ResponseApps:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/App' }
        message: { type: string }
    ResponseApp:
      type: object
      properties:
        data: { $ref: '#/components/schemas/App' }
        message: { type: string }
    ExportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            artifact: { $ref: '#/components/schemas/ExportArtifact' }
        message: { type: string }
    ExportArtifact:
      type: object
      properties:
        path:
          type: string
          description: Absolute path to the generated artifact inside PICCOLO_STATE_DIR.
        kind:
          type: string
          enum: [control_only, full_data]
    ResponseAppWithServices:
      type: object
      properties:
        data:
          type: object
          properties:
            app: { $ref: '#/components/schemas/App' }
            listeners:
              type: array
              items: { $ref: '#/components/schemas/ServiceEndpoint' }
            containers:
              type: array
              items: { $ref: '#/components/schemas/AppContainerStatus' }
    AppContainerStatus:
      type: object
      properties:
        service: { type: string }
        container_id: { type: string }
        running: { type: boolean }
    App:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        type: { type: string }
        status: { type: string, enum: [running, stopped, error] }
        primary_service: { type: string }
        network_anchor_id: { type: string }
        containers:
          type: object
          additionalProperties: { type: string }
        volumes: { type: array, items: { $ref: '#/components/schemas/AppVolume' } }
        environment: { type: object, additionalProperties: { type: string } }
    AppVolume:
      type: object
      properties:
        container: { type: string }
        host: { type: string }
        size_limit: { type: string }
        shared: { type: boolean }
    AppListener:
      type: object
      properties:
        name: { type: string }
        guest_port: { type: integer }
        flow: { type: string, enum: [tcp, tls], nullable: true }
        protocol: { type: string, enum: [raw, http, websocket], nullable: true }
        protocol_middleware:
          type: array
          items: { $ref: '#/components/schemas/AppProtocolMiddleware' }
        remote_ports:
          type: array
          items: { type: integer }
    AppProtocolMiddleware:
      type: object
      properties:
        name: { type: string }
        params: { type: object, additionalProperties: { type: object } }
    ResponseAppListenersUpdate:
      type: object
      properties:
        instance_id: { type: string }
        status: { type: string }
        listeners_updated: { type: boolean }
        container_recreated: { type: boolean }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/ServiceEndpoint' }
    ServiceEndpoint:
      type: object
      properties:
        app: { type: string }
        name: { type: string }
        guest_port: { type: integer }
        host_port: { type: integer, description: Port bound on 127.0.0.1 for LAN }
        public_port: { type: integer }
        remote_ports:
          type: array
          items: { type: integer }
          description: Explicit ports advertised on the remote listener hostname; defaults to [80, 443].
        remote_host:
          type: string
          nullable: true
          description: Context-aware remote hostname matching the requesting portal.
        remote_hosts:
          type: array
          items: { type: string }
          description: All remote hostnames across all active portals.
        flow: { type: string }
        protocol: { type: string }
        middleware: { type: array, items: { type: object } }
        local_url: { type: string, nullable: true }
    StorageDisks:
      type: object
      properties:
        disks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              model: { type: string }
              size_bytes: { type: integer }
              health: { type: string }
              status: { type: string }
              mountpoint: { type: string, nullable: true }
              encrypted: { type: boolean }
              label: { type: string, nullable: true }
    OSUpdate:
      type: object
      properties:
        current_version: { type: string }
        available_version: { type: string }
        pending: { type: boolean }
        requires_reboot: { type: boolean }
        last_checked: { type: string, format: date-time }
        meta:
          type: object
          description: Additional MicroOS-specific update details (optional; empty on unsupported hosts).
          properties:
            supported: { type: boolean, description: True when transactional-update tooling is available }
            active_snapshot_id: { type: string }
            default_snapshot_id: { type: string }
            active_snapshot_source: { type: string }
            active_snapshot: { $ref: '#/components/schemas/SnapshotInfo' }
            default_snapshot: { $ref: '#/components/schemas/SnapshotInfo' }
            staged_snapshot: { $ref: '#/components/schemas/SnapshotInfo' }
            rpm_updates_available: { type: integer, description: Count of pending RPM updates (best-effort) }
            piccolod_active: { type: string, description: "Active piccolod RPM version, if installed" }
            piccolod_staged: { type: string, description: "Staged piccolod RPM version, if differs from active" }
            last_run: { $ref: '#/components/schemas/TransactionalUpdateRun' }
            last_request: { $ref: '#/components/schemas/UpdateRequest' }
            derived_outcome: { type: string, description: "Derived outcome of the last request (applied, pending-reboot, not-applied, empty when unknown)" }
    SnapshotInfo:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
    TransactionalUpdateRun:
      type: object
      properties:
        result: { type: string, description: "Systemd Result field (e.g., success, timeout)" }
        exit_code: { type: integer }
        ran_at: { type: string, format: date-time, nullable: true }
        logs:
          type: array
          items: { type: string }
    UpdateRequest:
      type: object
      properties:
        last_action: { type: string, description: apply or rollback }
        target_snapshot: { type: string, nullable: true }
        requested_at: { type: string, format: date-time, nullable: true }
        unit_name: { type: string, nullable: true }
        exit_code: { type: integer, nullable: true }
        immediate_result: { type: string, description: success/failed/unknown, nullable: true }
        message: { type: string, nullable: true }
    RemoteStatus:
      type: object
      properties:
        enabled: { type: boolean }
        state: { type: string }
        solver: { type: string }
        endpoint: { type: string, nullable: true }
        portal_hostname: { type: string, nullable: true }
        latency_ms: { type: integer, nullable: true }
        last_handshake: { type: string, format: date-time, nullable: true }
        next_renewal: { type: string, format: date-time, nullable: true }
        issuer: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        warnings:
          type: array
          items: { type: string }
        guide_verified_at: { type: string, format: date-time, nullable: true }
        listeners:
          type: array
          items: { $ref: '#/components/schemas/RemoteListener' }
        aliases:
          type: array
          items: { $ref: '#/components/schemas/RemoteAlias' }
        certificates:
          type: array
          items: { $ref: '#/components/schemas/RemoteCertificate' }
    RemoteListener:
      type: object
      properties:
        name: { type: string }
        remote_host: { type: string }
    RemoteAlias:
      type: object
      properties:
        id: { type: string }
        hostname: { type: string }
        listener: { type: string }
        status: { type: string }
        last_checked: { type: string, format: date-time, nullable: true }
        message: { type: string, nullable: true }
    RemoteCertificate:
      type: object
      properties:
        id: { type: string }
        domains:
          type: array
          items: { type: string }
        solver: { type: string, nullable: true }
        issued_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        next_renewal: { type: string, format: date-time, nullable: true }
        status: { type: string, nullable: true }
        failure_reason: { type: string, nullable: true }
    RemotePreflightCheck:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        detail: { type: string, nullable: true }
        next_step: { type: string, nullable: true }
    RemoteEvent:
      type: object
      properties:
        ts: { type: string, format: date-time }
        level: { type: string }
        source: { type: string }
        message: { type: string }
        next_step: { type: string, nullable: true }
    RemoteGuideInfo:
      type: object
      properties:
        command: { type: string }
        requirements:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
        docs_url: { type: string }
        verified_at: { type: string, format: date-time, nullable: true }
    StorageMounts:
      type: object
      properties:
        mounts:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              device: { type: string }
              type: { type: string }
              options: { type: string }
    RecoveryKey:
      type: object
      properties:
        present: { type: boolean }
        mnemonic: { type: string, nullable: true }
    AppLogs:
      type: object
      properties:
        app: { type: string }
        entries:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              level: { type: string }
              message: { type: string }
    Events:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              level: { type: string }
              source: { type: string }
              message: { type: string }
              next_step: { type: string, nullable: true }
    Health:
      type: object
      properties:
        overall: { type: string, enum: [healthy, degraded, unhealthy] }
        summary: { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [pass, fail, warn, info] }
              description: { type: string }
              details: { type: string }
        permissions:
          type: object
          additionalProperties: { type: string }
    BackupItem:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer }
    BackupList:
      type: object
      properties:
        backups:
          type: array
          items: { $ref: '#/components/schemas/BackupItem' }
    InstallTarget:
      type: object
      properties:
        id: { type: string }
        model: { type: string }
        size_bytes: { type: integer }
        contents:
          type: array
          items: { type: string }
        erase_warning: { type: boolean }
    InstallTargets:
      type: object
      properties:
        targets:
          type: array
          items: { $ref: '#/components/schemas/InstallTarget' }
    InstallPlan:
      type: object
      properties:
        plan:
          type: object
          properties:
            target: { type: string }
            actions:
              type: array
              items: { type: string }
            simulate: { type: boolean }
    FetchLatest:
      type: object
      properties:
        version: { type: string }
        verified: { type: boolean }
        size_bytes: { type: integer }
    Session:
      type: object
      properties:
        authenticated: { type: boolean }
        user: { type: string }
        expires_at: { type: string, format: date-time }
        volumes_locked: { type: boolean }
        password_stale: { type: boolean }
        recovery_stale: { type: boolean }
    CatalogResponse:
      type: object
      properties:
        apps:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    CatalogItem:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        icon: { type: string, nullable: true }
        version: { type: string }
        category: { type: string }
        compatibility: { type: string, nullable: true }
        maintainer: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        source_url: { type: string, nullable: true }
    TaskProgressEvent:
      type: object
      properties:
        task_id: { type: string }
        task_type: { type: string }
        instance_id: { type: string, nullable: true }
        phase: { type: string }
        progress: { type: integer }
        message: { type: string }
        metadata: { type: object, nullable: true }
        is_complete: { type: boolean }
        error: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: piccolo_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
