# specification.yaml — Piccolo OS app.yaml reference
#
# This file is:
# 1) A human-readable reference for the Piccolo App Manifest schema, and
# 2) Valid YAML you can copy as a starting point.
#
# Conventions:
# - Fields that must exist in a runnable manifest are marked "REQUIRED".
# - All examples are safe to delete; the schema only cares about the YAML keys/values.
# - This documentation is aligned with the parser in `internal/app/parser.go`, and incorporates RFCs where noted.
#
# Templating (install-time):
# - The manifest is rendered as a Go template. You can reference:
#   - Inputs: {{ .Inputs.<name> }}
#   - System: {{ .System.Domain }}, {{ .System.Architecture }}
# - Optional inputs (required: false) that the user does not provide are
#   automatically backfilled before rendering:
#   - If the input declares a `default`, that value is used.
#   - Otherwise a type-appropriate zero value is injected:
#     string/password → "", boolean → false, int → 0, array → [].
#   - This means {{ .Inputs.optional_field }} is always safe to use.
#   - Required inputs that are missing will still produce a template error.
# - If at least one service declares `oidc_client`, Piccolo also provides:
#   - {{ .System.Auth.Issuer }}
#   - {{ .System.Auth.ClientID }}
#   - {{ .System.Auth.ClientSecret }}
# - The internal CA is mounted at each service's `oidc_client.ca_mount_path`.
#
# RFC references:
# - Listener auth rules + service-level `oidc_client`: docs/rfc/20260112-listener-auth-rules.md
# - Hostname scheme + optional LAN host-based routing: docs/rfc/20260114-hostname-scheme-routing.md
# - Unified app identity model: docs/rfc/20260130-unified-app-identity-model.md
#
# -----------------------------------------------------------------------------
# App Identity (RFC 20260130)
#
# Apps are identified by their PRIMARY LISTENER NAME (service mode) or WORKSPACE_NAME (workspace mode).
# There is no separate `name` field. The identity is derived from:
#
#   - Service mode: the listener marked with `name: __primary` in author-written YAML.
#   - Workspace mode: the `workspace_name` field under x-piccolo.
#
# The `__primary` marker is a magic placeholder that gets replaced at install time with
# the user-provided `__app_address__` input value. This enables catalog apps to have
# user-customizable addresses while maintaining a single source of identity.
#
# Reserved names (cannot be used as listener names or workspace_name):
#   api, www, admin, root, system, piccolo, piccoloos, __primary
#
# -----------------------------------------------------------------------------
# Minimal app (service mode)
#
# inputs:
#   __app_address__:
#     type: string
#     label: "App Address"
#     required: true
# services:
#   main:
#     image: ghost:latest
#     bind_ports: [2368]
# listeners:
#   - name: __primary
#     guest_port: 2368
#     flow: tcp
#     protocol: http
# x-piccolo:
#   mode: service
#
# -----------------------------------------------------------------------------
# Custom/catalog app (service mode, __primary marker for user-provided address)
#
# inputs:
#   __app_address__:
#     type: string
#     label: "App Address"
#     required: true
# services:
#   main:
#     image: ghost:latest
#     bind_ports: [2368]
# listeners:
#   - name: __primary
#     guest_port: 2368
#     flow: tcp
#     protocol: http
# x-piccolo:
#   mode: service
#
# -----------------------------------------------------------------------------
# Full reference (all fields documented)
#

# Optional: user (default) | system (starts during boot).
type: user

# Optional: Dynamic configuration collected from the installer UI.
# Values are available via {{ .Inputs.<name> }}.
inputs:
  # RESERVED INPUT (RFC 20260130): When a listener is named `__primary`, you MUST
  # define an `__app_address__` input. The install handler substitutes this value
  # for `__primary` at install time, making it the app's identity.
  __app_address__:
    type: string
    label: "App Address"
    description: "The subdomain/address for your app (e.g., 'blog' → blog.piccolo.local)"
    required: true
    validation:
      regex: "^[a-z][a-z0-9]{0,15}$"
      message: "Only lowercase letters and numbers allowed; must start with a letter; max 16 chars."
  subdomain:
    type: string # string | boolean | int | password | array
    label: "Subdomain"
    description: "Used for listener naming and UI (e.g., listener 'metrics' → metrics-<app>.<base> in host-based URLs)"
    default: "dev"
    required: true
    validation:
      regex: "^[a-z][a-z0-9]{0,15}$"
      message: "Only lowercase letters and numbers allowed; must start with a letter; max 16 chars."
  admin_password:
    type: password
    label: "Admin Password"
    description: "If generate=true, the backend can pre-fill a strong random value."
    generate: true
    required: true
  trusted_suffixes:
    type: array # List of strings. {{ .Inputs.trusted_suffixes }} auto-renders as JSON array.
    label: "Trusted Suffixes"
    description: "Domain suffixes for federation. Auto-renders as JSON array in templates."
    default:
      - ".example.com"

# Optional: Which service receives all listener traffic (v1 listeners target the primary service).
# Defaults to "main".
# Service mode only: if exactly one service is defined, that service name is also accepted as the default.
# Workspace mode: set primary_service explicitly if your sole service is not named "main".
primary_service: main

# REQUIRED: Container definitions.
# - `x-piccolo.mode: workspace` MUST define exactly one service.
# - `x-piccolo.mode: service` MAY define multiple services.
# - Top-level `image`, `environment`, `storage`, `resources`, and `auth` are deprecated and rejected.
services:
  main:
    # REQUIRED
    image: ubuntu:22.04

    # REQUIRED (may be empty): declare every port this service binds inside the shared network namespace.
    # Every listener guest_port MUST appear in exactly one service's bind_ports. The declaring
    # service is the documented owner; runtime routing still targets the shared namespace + port.
    bind_ports: [8080, 22]

    # Optional: start/stop ordering only (not readiness).
    after: []

    # Optional: environment variables passed to the container.
    environment:
      EXAMPLE_ENV: "hello"

    # Optional: storage mounts for durable and temporary data.
    # Host paths are NOT user-configurable; Piccolo maps these into the per-app encrypted volume.
    storage:
      persistent:
        data:
          container: /var/lib/example/data
          size_limit: 50GB # Optional: quota (B, KB, MB, GB, TB)
      temporary:
        cache:
          container: /var/lib/example/cache
          size_limit: 1GB

    # Optional: resource limits.
    resources:
      limits:
        memory: 1GB
        cpu: 1.0
        storage: 10GB

    # Optional: OIDC client injection (RFC 20260112 §4.2).
    #
    # When used, Piccolo registers an OIDC client for the app and provides credentials during install-time
    # templating via {{ .System.Auth.* }}. Only services that declare `oidc_client` receive the secrets.
    #
    # Required if any listener auth rule uses strategy: oidc_passthrough.
    oidc_client:
      redirect_uri_paths: # REQUIRED: callback path segments for OIDC redirects.
        # Piccolo generates full redirect URIs by combining all valid access origins
        # (Remote, Alias, LAN host-based, LAN port-based) with these paths.
        # Must be non-empty. Each path must start with "/".
        # Comparison is case-sensitive with no normalization (RFC 3986 section 6.2.1).
        - /callback
        - /oauth/callback
      redirect_uris:
        # Optional: explicit URIs for native/desktop apps (RFC 8252).
        # Only localhost/127.0.0.1/::1 or custom schemes are allowed.
        # These are used as-is without origin expansion.
        - "app.example:///oauth-callback"
        - "http://localhost:8081/callback"
      authorize_paths:
        # Optional: app paths whose responses contain the OIDC authorization URL.
        # Used by the proxy to rewrite the LAN-based authorization_endpoint to
        # the correct portal origin for WAN access. Only responses on these
        # exact paths (text content types only) are rewritten. Required for
        # apps that embed the authorization URL in API responses (e.g., AJAX
        # POSTs returning JSON with a redirect URL).
        - /auth/login
        - /api/oauth/authorize
      ca_mount_path: /etc/ssl/certs/piccolo-internal-ca.crt # REQUIRED
      env: # REQUIRED (may be templated)
        ISSUER_URL: "{{ .System.Auth.Issuer }}"
        CLIENT_ID: "{{ .System.Auth.ClientID }}"
        CLIENT_SECRET: "{{ .System.Auth.ClientSecret }}"
        PICCOLO_CA_PATH: "/etc/ssl/certs/piccolo-internal-ca.crt"

  # Optional additional services (service mode only).
  worker:
    image: busybox:1.36
    bind_ports: [] # REQUIRED even if empty
    after: [main]
    environment:
      WORKER: "1"

# LISTENERS -------------------------------------------------------------------
# Listeners are required in service mode. Workspace mode may omit listeners.
#
# Each listener defines a public proxy endpoint; piccolod allocates a per-listener public port on the host
# (or binds a specific well-known port when `port_claim` is set).
# - LAN (port-based): http://<host>:<public_port>/...
# - LAN (host-based; HTTP/WebSocket only, optional): http://<app>.<lan-base>/... and http://<listener>-<app>.<lan-base>/...
# - LAN (port-claimed): <host>:<port_claim> — bypasses auto-allocation, binds the exact port
# - Remote/WAN: https://<app>.<remote-base>/... and https://<listener>-<app>.<remote-base>/... (published via Nexus)
# - Remote (port-claimed, self-managed Nexus only): claimed ports are also registered on the relay
#
# Notes:
# - <lan-base> is the device mDNS hostname (e.g., piccolo.local).
# - <remote-base> is the remote portal hostname apex (device base domain).
#
# App Identity (RFC 20260130):
# - Service-mode apps derive their identity from the PRIMARY listener name.
# - Author-written manifests: exactly one listener must be named `__primary`.
# - The `__primary` marker is replaced at install time with the `__app_address__` input value.
#
# If remote_ports is omitted, Piccolo defaults to [80, 443].
#
# Flow types:
# - tcp: unencrypted TCP transport (default). Supports all protocols (raw, http, websocket).
# - tls: TLS passthrough. Piccolo does not terminate TLS; the app handles its own certificates.
#        Not eligible for host-based routing or auth rules.
# - udp: raw UDP transport. Cannot use protocol: http or websocket.
#        Not eligible for host-based routing, auth rules, or certificates.
listeners:
  # REQUIRED: Listener identifier.
  # Constraints:
  # - 1..16 chars
  # - lowercase letters and numbers only (no hyphens), except `__primary` magic marker
  # - must start with a letter (or `_` for __primary)
  # - reserved names not allowed on PRIMARY listener: api, www, admin, root, system, piccolo, piccoloos, __primary
  #   (non-primary listeners are exempt — their derived hostname <listener>-<app> cannot collide)
  # - required for host-based routing (RFC 20260114)
  #
  # Use `__primary` as the name for custom/catalog apps. This marker is replaced with the
  # user-provided `__app_address__` input value during installation.
  - name: __primary
    guest_port: 8080
    flow: tcp # tcp (default) | tls (passthrough; no HTTP visibility) | udp (raw UDP transport)
    protocol: http # raw (default) | http | websocket
    remote_ports: [80, 443]

    # Optional: claim a specific well-known port on the LAN instead of auto-allocating
    # from the 35000-45000 range. When a self-managed Nexus relay is configured, the
    # port is also claimed on the relay for remote access.
    #
    # Constraints:
    # - Must be 1-65535
    # - Cannot be 80, 443 (portal), or 5353 (mDNS)
    # - Cannot overlap host-bind range (15000-25000) or auto-allocate range (35000-45000)
    # - Works with all flow types (tcp, tls, udp)
    # - flow: udp cannot use protocol: http or websocket
    # - Two listeners may share the same guest_port if they use different transport
    #   protocols (TCP vs UDP), e.g., DNS on both TCP 53 and UDP 53
    # - Cross-app uniqueness: protocol-aware — one app can claim TCP 53 while
    #   another claims UDP 53 (separate OS port namespaces)
    #
    # The user is shown port claim requirements at install time and must approve.
    # Firewall rules are opened automatically (runtime-only, re-applied on boot).
    #
    # port_claim: 8080

    # Optional: ordered protocol middleware pipeline. Reserved for future use.
    # protocol_middleware:
    #   - name: some_middleware

    # Optional: listener auth rules (RFC 20260112 §4.1).
    # Auth is enforced only when flow: tcp AND protocol: http|websocket.
    # TLS or raw listeners ignore auth rules entirely.
    #
    # - If auth is omitted OR rules is empty: all paths default to "protected".
    # - Rules evaluate top-to-bottom; first match wins.
    # - match types:
    #   - exact: byte-for-byte match
    #   - prefix: strings.HasPrefix() match; prefix paths MUST end with "/"
    #   - pattern: Go path.Match(rule.path, requestPath)
    # - strategies:
    #   - public: pass-through (no session checks)
    #   - protected: require Piccolo session + allowed_apps, no identity headers
    #   - headers: require Piccolo session + allowed_apps, inject X-Piccolo-* identity headers
    #   - oidc_passthrough: pass-through; app authenticates users via Piccolo OIDC (requires services[].oidc_client)
    #
    # Constraints:
    # - auth rules require flow: tcp AND protocol: http|websocket.
    auth:
      rules:
        - path: "/.well-known/acme-challenge/"
          type: prefix
          strategy: public
        - path: "/admin/"
          type: prefix
          strategy: protected
        - path: "/"
          type: prefix
          strategy: oidc_passthrough

    # Optional: connection-level admission before listener bytes reach the app.
    #
    # IP/CIDR rules:
    # - default: allow | deny (default is allow)
    # - rules are first-match-wins; unmatched sources use default.
    #
    # mTLS:
    # - connection_auth.mtls requires x-piccolo.requires_features to include
    #   connection_auth_mtls_v1.
    # - V1 supports only verifier.type: piccolo_session.
    # - Valid on protocol: http, protocol: websocket, and protocol: raw only
    #   when flow: tcp plus tls_wrap: true.
    # - Invalid on flow: tls, flow: udp, raw TCP without tls_wrap, and with port_claim.
    # - For mTLS listeners, remote_ports are TLS-mux-only remote ports: TLS/SNI traffic
    #   may route to the TLS mux, non-TLS payload traffic returns no route. Port 80
    #   HTTP-01 challenge and redirect traffic for known app hostnames is still handled
    #   by piccolod, not by the app listener.
    # - If combined with auth.rules on HTTP/WebSocket, both connection_auth.mtls and
    #   the L7 auth rule must pass. Ordinary browsers will fail unless they present
    #   an accepted client certificate.
    connection_auth:
      default: deny
      rules:
        - match: 10.0.0.0/8
          strategy: allow
      mtls:
        verifier:
          type: piccolo_session

  - name: ssh
    guest_port: 22
    flow: tcp
    protocol: raw
    tls_wrap: true
    remote_ports: [443]
    connection_auth:
      mtls:
        verifier:
          type: piccolo_session
    # Developer-mode no-auth sshd is acceptable only when this verified
    # connection_auth_mtls_v1 Piccolo guard is present and the container port has
    # no other exposure path.
    # Do not set port_claim with connection_auth.mtls in v1; that would create
    # a direct port path where the TLS mux cannot enforce client cert auth.

  # Example: DNS listener with port claims (e.g., Pi-hole)
  # DNS requires both UDP and TCP on port 53. Two listeners can share the same
  # guest_port when they use different transport protocols.
  #
  # - name: dns
  #   guest_port: 53
  #   flow: udp
  #   protocol: raw
  #   port_claim: 53
  # - name: dnstcp
  #   guest_port: 53
  #   flow: tcp
  #   protocol: raw
  #   port_claim: 53

# HEALTH MONITORING ------------------------------------------------------------
# Optional: Piccolo can probe an HTTP endpoint through a named listener.
healthcheck:
  http:
    path: /health
    port: "{{ .Inputs.__app_address__ }}" # Listener name to route the probe through (use app address for primary)
    timeout: 30s
    retries: 3

# APP CONFIG ------------------------------------------------------------------
# Optional: free-form YAML copied to `/piccolo/config/app.yaml` inside each container.
app_config:
  feature_flags:
    demo_mode: true

# PERMISSIONS -----------------------------------------------------------------
# Optional: omit to accept Piccolo defaults.
permissions:
  network:
    internet: allow # allow | deny
    local_network: allow
    dns: allow
    allowed_domains:
      - "github.com"
      - "registry.npmjs.org"
  resources:
    max_processes: 200
    max_open_files: 2048
    privileged: false
  filesystem:
    read_only_root: false
    device_access: deny # allow | deny

# WORKSPACE NAME ---------------------------------------------------------------
# REQUIRED for workspace mode (RFC 20260130): app identity when no listeners exist.
# This is a ROOT-LEVEL field, not under x-piccolo.
# Constraints:
# - 1..16 chars
# - lowercase letters and numbers only (no hyphens)
# - must start with a letter
# - reserved names not allowed: api, www, admin, root, system, piccolo, piccoloos, __primary
# - ignored when listeners are present (identity comes from primary listener instead)
#
# Example workspace app:
# workspace_name: devenv
# x-piccolo:
#   mode: workspace
workspace_name: ""  # Only used when mode: workspace AND no listeners defined

# EXTENSIONS ------------------------------------------------------------------
# REQUIRED: you must set `x-piccolo.mode` for every app.
x-piccolo:
  mode: service # service | workspace
  requires_features:
    - connection_auth_mtls_v1 # Required if any listener uses connection_auth.mtls.

  replication:
    hot:
      datasets: [disk, data]
    cold:
      datasets: [disk, data]
      rpo: 15m
      consistency: crash_consistent # crash_consistent | quiesced
  tmpfs:
    - /tmp
    - /run
    - /var/run
    - /var/tmp
  secrets:
    # One of: env | files | mixed (informational; enforcement is implementation-defined).
    injection: mixed
  runtime:
    podman:
      imagestore:
        policy: catalog_non_sensitive_else_encrypted
