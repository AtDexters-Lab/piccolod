# specification.yaml — Piccolo OS app.yaml reference
#
# This file is:
# 1) A human-readable reference for the Piccolo App Manifest schema, and
# 2) Valid YAML you can copy as a starting point.
#
# Conventions:
# - Fields that must exist in a runnable manifest are marked "REQUIRED".
# - All examples are safe to delete; the schema only cares about the YAML keys/values.
# - This documentation is aligned with the parser in `internal/app/parser.go`, and incorporates RFCs where noted.
#
# Templating (install-time):
# - The manifest is rendered as a Go template. You can reference:
#   - Inputs: {{ .Inputs.<name> }}
#   - System: {{ .System.Domain }}, {{ .System.Architecture }}
# - If at least one service declares `oidc_client`, Piccolo also provides:
#   - {{ .System.Auth.Issuer }}
#   - {{ .System.Auth.ClientID }}
#   - {{ .System.Auth.ClientSecret }}
# - The internal CA is mounted at each service's `oidc_client.ca_mount_path`.
#
# RFC references:
# - Listener auth rules + service-level `oidc_client`: docs/rfc/20260112-listener-auth-rules.md
# - Hostname scheme + optional LAN host-based routing: docs/rfc/20260114-hostname-scheme-routing.md
#
# -----------------------------------------------------------------------------
# Minimal app (service mode)
#
# name: blog
# services:
#   main:
#     image: ghost:latest
#     bind_ports: [2368]
# listeners:
#   - name: web
#     guest_port: 2368
#     flow: tcp
#     protocol: http
# x-piccolo:
#   mode: service
#
# -----------------------------------------------------------------------------
# Full reference (all fields documented)
#

# REQUIRED: App identifier.
# Constraints:
# - 1..31 chars
# - lowercase letters and numbers only (no hyphens)
# - must start with a letter
# - must end with a letter or number
# - reserved names not allowed: api, www, admin, root, system, piccolo, piccoloos
# - required for host-based routing (RFC 20260114)
name: exampleapp

# Optional: user (default) | system (starts during boot).
type: user

# Optional: Dynamic configuration collected from the installer UI.
# Values are available via {{ .Inputs.<name> }}.
inputs:
  subdomain:
    type: string # string | boolean | int | password
    label: "Subdomain"
    description: "Used for listener naming and UI (e.g., listener 'metrics' → metrics-<app>.<base> in host-based URLs)"
    default: "dev"
    required: true
    validation:
      regex: "^[a-z][a-z0-9]{0,30}$"
      message: "Only lowercase letters and numbers allowed; must start with a letter; max 31 chars."
  admin_password:
    type: password
    label: "Admin Password"
    description: "If generate=true, the backend can pre-fill a strong random value."
    generate: true
    required: true

# Optional: Which service receives all listener traffic (v1 listeners target the primary service).
# Defaults to "main".
# Service mode only: if exactly one service is defined, that service name is also accepted as the default.
# Workspace mode: set primary_service explicitly if your sole service is not named "main".
primary_service: main

# REQUIRED: Container definitions.
# - `x-piccolo.mode: workspace` MUST define exactly one service.
# - `x-piccolo.mode: service` MAY define multiple services.
# - Top-level `image`, `environment`, `storage`, `resources`, and `auth` are deprecated and rejected.
services:
  main:
    # REQUIRED
    image: ubuntu:22.04

    # REQUIRED (may be empty): declare every port this service binds inside the shared network namespace.
    # If multiple services exist, the primary service MUST include every listener guest_port here.
    bind_ports: [8080, 22]

    # Optional: start/stop ordering only (not readiness).
    after: []

    # Optional: environment variables passed to the container.
    environment:
      EXAMPLE_ENV: "hello"

    # Optional: storage mounts for durable and temporary data.
    # Host paths are NOT user-configurable; Piccolo maps these into the per-app encrypted volume.
    storage:
      persistent:
        data:
          container: /var/lib/example/data
          size_limit: 50GB # Optional: quota (B, KB, MB, GB, TB)
      temporary:
        cache:
          container: /var/lib/example/cache
          size_limit: 1GB

    # Optional: resource limits.
    resources:
      limits:
        memory: 1GB
        cpu: 1.0
        storage: 10GB

    # Optional: OIDC client injection (RFC 20260112 §4.2).
    #
    # When used, Piccolo registers an OIDC client for the app and provides credentials during install-time
    # templating via {{ .System.Auth.* }}. Only services that declare `oidc_client` receive the secrets.
    #
    # Required if any listener auth rule uses strategy: oidc_passthrough.
    oidc_client:
      redirect_uris:
        # Optional: native/desktop redirects (RFC 8252). Only localhost/127.0.0.1/::1 or custom schemes are allowed.
        - "app.example:///oauth-callback"
        - "http://localhost:8081/callback"
      ca_mount_path: /etc/ssl/certs/piccolo-internal-ca.crt # REQUIRED
      env: # REQUIRED (may be templated)
        ISSUER_URL: "{{ .System.Auth.Issuer }}"
        CLIENT_ID: "{{ .System.Auth.ClientID }}"
        CLIENT_SECRET: "{{ .System.Auth.ClientSecret }}"
        PICCOLO_CA_PATH: "/etc/ssl/certs/piccolo-internal-ca.crt"

  # Optional additional services (service mode only).
  worker:
    image: busybox:1.36
    bind_ports: [] # REQUIRED even if empty
    after: [main]
    environment:
      WORKER: "1"

# LISTENERS -------------------------------------------------------------------
# Listeners are required in service mode. Workspace mode may omit listeners.
#
# Each listener defines a public proxy endpoint; piccolod allocates a per-listener public port on the host.
# - LAN (port-based): http://<host>:<public_port>/...
# - LAN (host-based; HTTP/WebSocket only, optional): http://<app>.<lan-base>/... and http://<listener>-<app>.<lan-base>/...
# - Remote/WAN: https://<app>.<remote-base>/... and https://<listener>-<app>.<remote-base>/... (published via Nexus)
#
# Notes:
# - <lan-base> is the device mDNS hostname (e.g., piccolo.local).
# - <remote-base> is the remote portal hostname apex (device base domain).
#
# If remote_ports is omitted, Piccolo defaults to [80, 443].
listeners:
  # REQUIRED: Listener identifier.
  # Constraints:
  # - 1..31 chars
  # - lowercase letters and numbers only (no hyphens)
  # - must start with a letter
  # - reserved names not allowed: piccolo, piccoloos
  # - required for host-based routing (RFC 20260114)
  - name: "{{ .Inputs.subdomain }}"
    guest_port: 8080
    flow: tcp # tcp (default) | tls (passthrough; no HTTP visibility)
    protocol: http # raw (default) | http | websocket
    remote_ports: [80, 443]

    # Optional: ordered protocol middleware pipeline. Reserved for future use.
    # protocol_middleware:
    #   - name: some_middleware

    # Optional: listener auth rules (RFC 20260112 §4.1).
    # Auth is enforced only when flow: tcp AND protocol: http|websocket.
    # TLS or raw listeners ignore auth rules entirely.
    #
    # - If auth is omitted OR rules is empty: all paths default to "protected".
    # - Rules evaluate top-to-bottom; first match wins.
    # - match types:
    #   - exact: byte-for-byte match
    #   - prefix: strings.HasPrefix() match; prefix paths MUST end with "/"
    #   - pattern: Go path.Match(rule.path, requestPath)
    # - strategies:
    #   - public: pass-through (no session checks)
    #   - protected: require Piccolo session + allowed_apps, no identity headers
    #   - headers: require Piccolo session + allowed_apps, inject X-Piccolo-* identity headers
    #   - oidc_passthrough: pass-through; app authenticates users via Piccolo OIDC (requires services[].oidc_client)
    #
    # Constraints:
    # - auth rules require flow: tcp AND protocol: http|websocket.
    auth:
      rules:
        - path: "/.well-known/acme-challenge/"
          type: prefix
          strategy: public
        - path: "/admin/"
          type: prefix
          strategy: protected
        - path: "/"
          type: prefix
          strategy: oidc_passthrough

  - name: ssh
    guest_port: 22
    flow: tcp
    protocol: raw
    remote_ports: [22]

# HEALTH MONITORING ------------------------------------------------------------
# Optional: Piccolo can probe an HTTP endpoint through a named listener.
healthcheck:
  http:
    path: /health
    port: "{{ .Inputs.subdomain }}" # Listener name to route the probe through
    timeout: 30s
    retries: 3

# APP CONFIG ------------------------------------------------------------------
# Optional: free-form YAML copied to `/piccolo/config/app.yaml` inside each container.
app_config:
  feature_flags:
    demo_mode: true

# PERMISSIONS -----------------------------------------------------------------
# Optional: omit to accept Piccolo defaults.
permissions:
  network:
    internet: allow # allow | deny
    local_network: allow
    dns: allow
    allowed_domains:
      - "github.com"
      - "registry.npmjs.org"
  resources:
    max_processes: 200
    max_open_files: 2048
    privileged: false
  filesystem:
    read_only_root: false
    device_access: deny # allow | deny

# EXTENSIONS ------------------------------------------------------------------
# REQUIRED: you must set `x-piccolo.mode` for every app.
x-piccolo:
  mode: service # service | workspace
  replication:
    hot:
      datasets: [disk, data]
    cold:
      datasets: [disk, data]
      rpo: 15m
      consistency: crash_consistent # crash_consistent | quiesced
  tmpfs:
    - /tmp
    - /run
    - /var/run
    - /var/tmp
  secrets:
    # One of: env | files | mixed (informational; enforcement is implementation-defined).
    injection: mixed
  runtime:
    podman:
      imagestore:
        policy: catalog_non_sensitive_else_encrypted
