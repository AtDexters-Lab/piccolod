# Development environment (workspace-style persistence)
type: user

inputs:
  __app_address__:
    type: string
    label: "App Address"
    required: true
    validation:
      regex: "^[a-z][a-z0-9]{0,15}$"
      message: "Lowercase letters and numbers only; max 16 chars"
  password:
    type: password
    label: "Workspace Password"
    required: true
    generate: true

listeners:
  - name: __primary
    guest_port: 8080
    flow: tcp
    protocol: http
    remote_ports: [80, 443]

services:
  main:
    image: codercom/code-server:latest
    bind_ports: [8080]
    storage:
      persistent:
        projects:
          container: /home/coder/projects
          size_limit: 100GB
        config:
          container: /home/coder/.local
          size_limit: 5GB
      temporary:
        cache:
          container: /tmp/cache
          size_limit: 10GB
    environment:
      PASSWORD: "{{ .Inputs.password }}"
      SUDO_PASSWORD: "{{ .Inputs.password }}"

permissions:
  network:
    internet: allow

app_config:
  extensions:
    - ms-python.python
    - golang.go
  settings:
    theme: dark
    font_size: 14

# Piccolo-specific policies: a workspace is a "roaming" instance by default
# (disk + data replicated per policy; secrets may be injected via env for compatibility).
x-piccolo:
  mode: workspace
  secrets:
    injection: env
