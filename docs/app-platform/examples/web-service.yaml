# Web service example - typical self-hosted app
name: nextcloud

listeners:
  - name: web
    guest_port: 80
    flow: tcp
    protocol: http
    remote_ports: [80, 443]

primary_service: web
services:
  web:
    image: nextcloud:latest
    bind_ports: [80]
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: example
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: example
    storage:
      persistent:
        data:
          container: /var/www/html
          size_limit: 50GB
        config:
          container: /var/www/html/config
          size_limit: 1GB
  mysql:
    image: mysql:8
    bind_ports: [3306]
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: example
      MYSQL_ROOT_PASSWORD: example
    storage:
      persistent:
        db:
          container: /var/lib/mysql
          size_limit: 10GB

permissions:
  network:
    internet: allow     # Needs internet for app store, updates
  preset: web_service

healthcheck:
  http:
    path: /status.php
    port: web
    timeout: 30s
    retries: 3

# Piccolo-specific policies: typical self-hosted services replicate durable data,
# while keeping the container "disk" replaceable across upgrades.
x-piccolo:
  mode: service
