# Web service example - typical self-hosted app
type: user

inputs:
  __app_address__:
    type: string
    label: "App Address"
    required: true
    validation:
      regex: "^[a-z][a-z0-9]{0,15}$"
      message: "Lowercase letters and numbers only; max 16 chars"
  admin_password:
    type: password
    label: "Admin Password"
    required: true
    generate: true
  db_password:
    type: password
    label: "Database Password"
    required: true
    generate: true

listeners:
  - name: __primary
    guest_port: 80
    flow: tcp
    protocol: http
    remote_ports: [80, 443]

primary_service: web
services:
  web:
    image: nextcloud:latest
    bind_ports: [80]
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "{{ .Inputs.db_password }}"
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: "{{ .Inputs.admin_password }}"
    storage:
      persistent:
        data:
          container: /var/www/html
          size_limit: 50GB
        config:
          container: /var/www/html/config
          size_limit: 1GB
  mysql:
    image: mysql:8
    bind_ports: [3306]
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "{{ .Inputs.db_password }}"
      MYSQL_ROOT_PASSWORD: "{{ .Inputs.db_password }}"
    storage:
      persistent:
        db:
          container: /var/lib/mysql
          size_limit: 10GB

permissions:
  network:
    internet: allow     # Needs internet for app store, updates

healthcheck:
  http:
    path: /status.php
    port: "{{ .Inputs.__app_address__ }}"
    timeout: 30s
    retries: 3

# Piccolo-specific policies: typical self-hosted services replicate durable data,
# while keeping the container "disk" replaceable across upgrades.
x-piccolo:
  mode: service
